[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tarpslice-cli"
version = "1.0.0"
description = "CLI tool for generating tiled poster/tarpapel PDFs from images"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "Pillow==11.1.0",
    "reportlab==4.2.5",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
